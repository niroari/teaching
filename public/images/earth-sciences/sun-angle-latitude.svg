<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, Helvetica, sans-serif" font-size="15" direction="rtl">
<defs></defs>
<rect width="600" height="480" fill="#fafaf9"/>
<circle cx="200" cy="260" r="175" fill="#e0f2fe" stroke="#a8a29e" stroke-width="1.5"/><line x1="25" y1="260" x2="375" y2="260" stroke="#57534e" stroke-width="1" stroke-dasharray="5 5"/><text x="140" y="252" text-anchor="middle" font-size="13" fill="#57534e">קו המשווה</text><circle cx="200" cy="85" r="3" fill="#1f2937"/><text x="200" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">הקוטב הצפוני</text><polygon points="600,108 286.724,108 348.866,168 600,168" fill="#f59e0b" fill-opacity="0.28"/><line x1="600" y1="108" x2="286.724" y2="108" stroke="#f59e0b" stroke-width="1.5"/><line x1="600" y1="168" x2="348.866" y2="168" stroke="#f59e0b" stroke-width="1.5"/><path d="M286.7,108.0 A175,175 0 0 1 348.9,168.0" fill="none" stroke="#fb923c" stroke-width="7"/><polygon points="600,230 372.409,230 372.409,290 600,290" fill="#f59e0b" fill-opacity="0.28"/><line x1="600" y1="230" x2="372.409" y2="230" stroke="#f59e0b" stroke-width="1.5"/><line x1="600" y1="290" x2="372.409" y2="290" stroke="#f59e0b" stroke-width="1.5"/><path d="M372.4,230.0 A175,175 0 0 1 372.4,290.0" fill="none" stroke="#c2410c" stroke-width="7"/><text x="580" y="82" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">ליד הקוטב: הקרניים באלכסון</text><text x="580" y="100" text-anchor="start" font-size="13" fill="#57534e">האנרגיה מתפזרת על שטח גדול, וקר</text><text x="580" y="318" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">ליד קו המשווה: הקרניים כמעט ישרות</text><text x="580" y="336" text-anchor="start" font-size="13" fill="#57534e">האנרגיה מרוכזת בשטח קטן, וחם</text><text x="580" y="452" text-anchor="start" font-size="13" fill="#57534e">שתי האלומות רחבות באותה מידה</text>
</svg>
