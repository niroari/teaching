<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Arial, Helvetica, sans-serif" font-size="15" direction="rtl">
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
</defs>
<rect width="600" height="520" fill="#eef6fc"/>
<line x1="300" y1="20" x2="300" y2="370" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

<!-- High: sun, clear sky -->
<g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
<line x1="150" y1="22" x2="150" y2="32"/><line x1="150" y1="98" x2="150" y2="108"/>
<line x1="107" y1="65" x2="117" y2="65"/><line x1="183" y1="65" x2="193" y2="65"/>
<line x1="120" y1="35" x2="127" y2="42"/><line x1="173" y1="88" x2="180" y2="95"/>
<line x1="180" y1="35" x2="173" y2="42"/><line x1="127" y1="88" x2="120" y2="95"/>
</g>
<circle cx="150" cy="65" r="24" fill="#fbbf24"/>
<text x="150" y="140" text-anchor="middle" font-weight="bold" fill="#1f2937">שמיים בהירים</text>

<!-- Low: cloud and rain -->
<g fill="#94a3b8">
<circle cx="425" cy="62" r="20"/><circle cx="452" cy="50" r="26"/><circle cx="480" cy="64" r="19"/>
<rect x="405" y="62" width="92" height="22" rx="11"/>
</g>
<g stroke="#2563eb" stroke-width="2.5" stroke-linecap="round">
<line x1="420" y1="94" x2="415" y2="110"/><line x1="440" y1="94" x2="435" y2="110"/>
<line x1="460" y1="94" x2="455" y2="110"/><line x1="480" y1="94" x2="475" y2="110"/>
</g>
<text x="450" y="140" text-anchor="middle" font-weight="bold" fill="#1f2937">עננים, ולעתים גשם</text>

<!-- Sinking air -->
<g stroke="#374151" stroke-width="3" marker-end="url(#ad)">
<line x1="100" y1="170" x2="100" y2="355"/>
<line x1="200" y1="170" x2="200" y2="355"/>
</g>
<text x="150" y="255" text-anchor="middle" font-weight="bold" fill="#374151">האוויר שוקע</text>
<text x="150" y="277" text-anchor="middle" font-weight="bold" fill="#374151">ומתחמם</text>

<!-- Rising air -->
<g stroke="#374151" stroke-width="3" marker-end="url(#ad)">
<line x1="400" y1="355" x2="400" y2="170"/>
<line x1="500" y1="355" x2="500" y2="170"/>
</g>
<text x="450" y="255" text-anchor="middle" font-weight="bold" fill="#374151">האוויר עולה</text>
<text x="450" y="277" text-anchor="middle" font-weight="bold" fill="#374151">ומתקרר</text>

<!-- Wind -->
<text x="300" y="384" text-anchor="middle" font-weight="bold" fill="#047857">רוח מערבית: מהרמה אל השקע</text>
<line x1="150" y1="408" x2="440" y2="408" stroke="#047857" stroke-width="6" marker-end="url(#aw)"/>

<!-- Ground -->
<rect x="0" y="430" width="600" height="90" fill="#e7dcc6"/>
<line x1="0" y1="430" x2="600" y2="430" stroke="#a8a29e" stroke-width="1.5"/>
<text x="150" y="472" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d4ed8" direction="ltr">H</text>
<text x="150" y="500" text-anchor="middle" font-weight="bold" fill="#1f2937">רמה: לחץ גבוה</text>
<text x="450" y="472" text-anchor="middle" font-size="34" font-weight="bold" fill="#b91c1c" direction="ltr">L</text>
<text x="450" y="500" text-anchor="middle" font-weight="bold" fill="#1f2937">שקע: לחץ נמוך</text>
<text x="18" y="465" text-anchor="start" direction="ltr" font-size="13" fill="#57534e">מערב</text>
<text x="582" y="465" text-anchor="end" direction="ltr" font-size="13" fill="#57534e">מזרח</text>
</svg>
