<text x="580" y="40" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2937">חודש עברי אחד</text><text x="580" y="62" text-anchor="start" font-size="13" fill="#57534e">ראש חודש בערך במולד, אמצע החודש בערך בירח מלא</text><line x1="560" y1="250" x2="40" y2="250" stroke="#1f2937" stroke-width="2"/><rect x="526" y="150" width="68" height="68" rx="10" fill="#1f2937"/><circle cx="560" cy="184" r="24" fill="#3f4a5a"/><line x1="560" y1="244" x2="560" y2="256" stroke="#1f2937" stroke-width="2"/><text x="560" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">א׳: מולד</text><rect x="398.281" y="150" width="68" height="68" rx="10" fill="#1f2937"/><circle cx="432.281" cy="184" r="24" fill="#3f4a5a"/><path d="M432.280701754386,160 A24,24 0 0 1 432.280701754386,208 A0.0,24 0 0 1 432.280701754386,160 z" fill="#f5f5f4"/><line x1="432.281" y1="244" x2="432.281" y2="256" stroke="#1f2937" stroke-width="2"/><text x="432.281" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">ח׳: רבע ראשון</text><rect x="270.561" y="150" width="68" height="68" rx="10" fill="#1f2937"/><circle cx="304.561" cy="184" r="24" fill="#f5f5f4"/><line x1="304.561" y1="244" x2="304.561" y2="256" stroke="#1f2937" stroke-width="2"/><text x="304.561" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">ט״ו: ירח מלא</text><rect x="142.842" y="150" width="68" height="68" rx="10" fill="#1f2937"/><circle cx="176.842" cy="184" r="24" fill="#3f4a5a"/><path d="M176.84210526315792,160 A24,24 0 0 0 176.84210526315792,208 A0.0,24 0 0 1 176.84210526315792,160 z" fill="#f5f5f4"/><line x1="176.842" y1="244" x2="176.842" y2="256" stroke="#1f2937" stroke-width="2"/><text x="176.842" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">כ״ב: רבע אחרון</text><rect x="6" y="150" width="68" height="68" rx="10" fill="#1f2937"/><circle cx="40" cy="184" r="24" fill="#3f4a5a"/><line x1="40" y1="244" x2="40" y2="256" stroke="#1f2937" stroke-width="2"/><text x="40" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">מולד חדש</text><text x="304.561" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">פסח וסוכות בט״ו: ירח מלא</text><text x="304.561" y="372" text-anchor="middle" font-size="13" fill="#57534e">12 חודשי ירח: כ־354 ימים, 11 פחות משנת שמש</text>
</svg>
