<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, Helvetica, sans-serif" font-size="15" direction="rtl">
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
</defs>
<rect width="600" height="480" fill="#fafaf9"/>

<!-- ===== DAY ===== -->
<rect x="0" y="0" width="600" height="228" fill="#eef6fc"/>
<text x="580" y="34" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2937">ביום: בריזת ים</text>
<text x="580" y="56" text-anchor="start" font-size="13" fill="#57534e">היבשה חמה מהים</text>
<g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
<line x1="44" y1="14" x2="44" y2="20"/><line x1="44" y1="56" x2="44" y2="62"/>
<line x1="20" y1="38" x2="26" y2="38"/><line x1="62" y1="38" x2="68" y2="38"/>
<line x1="27" y1="21" x2="31" y2="25"/><line x1="57" y1="51" x2="61" y2="55"/>
<line x1="61" y1="21" x2="57" y2="25"/><line x1="31" y1="51" x2="27" y2="55"/>
</g>
<circle cx="44" cy="38" r="12" fill="#fbbf24"/>
<!-- surface: sea west (left), land east (right) -->
<rect x="0" y="176" width="270" height="52" fill="#dbeafe"/>
<rect x="270" y="176" width="330" height="52" fill="#f3e3cc"/>
<line x1="0" y1="176" x2="600" y2="176" stroke="#a8a29e" stroke-width="1.5"/>
<text x="135" y="208" text-anchor="middle" font-weight="bold" fill="#1e40af">ים</text>
<text x="435" y="208" text-anchor="middle" font-weight="bold" fill="#78350f">יבשה חמה</text>
<!-- circulation -->
<line x1="470" y1="150" x2="470" y2="86" stroke="#57534e" stroke-width="2" marker-end="url(#s)"/>
<line x1="440" y1="76" x2="160" y2="76" stroke="#57534e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#s)"/>
<line x1="130" y1="86" x2="130" y2="150" stroke="#57534e" stroke-width="2" marker-end="url(#s)"/>
<line x1="170" y1="160" x2="420" y2="160" stroke="#047857" stroke-width="5" marker-end="url(#g)"/>
<text x="295" y="148" text-anchor="middle" font-weight="bold" fill="#047857">רוח מהים ליבשה</text>
<text x="408" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#b91c1c" direction="ltr">L</text>
<text x="190" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d4ed8" direction="ltr">H</text>
<text x="535" y="122" text-anchor="middle" font-size="13" fill="#57534e">אוויר חם עולה</text>

<!-- ===== NIGHT ===== -->
<rect x="0" y="252" width="600" height="228" fill="#e8eaf2"/>
<text x="580" y="286" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2937">בלילה: בריזת יבשה</text>
<text x="580" y="308" text-anchor="start" font-size="13" fill="#57534e">הים חמים מהיבשה</text>
<path d="M50,270 A20,20 0 1 0 62,308 A15,15 0 1 1 50,270 z" fill="#64748b"/>
<rect x="0" y="428" width="270" height="52" fill="#dbeafe"/>
<rect x="270" y="428" width="330" height="52" fill="#e7e1d6"/>
<line x1="0" y1="428" x2="600" y2="428" stroke="#a8a29e" stroke-width="1.5"/>
<text x="135" y="460" text-anchor="middle" font-weight="bold" fill="#1e40af">ים חמים</text>
<text x="435" y="460" text-anchor="middle" font-weight="bold" fill="#57534e">יבשה קרה</text>
<line x1="130" y1="402" x2="130" y2="338" stroke="#57534e" stroke-width="2" marker-end="url(#s)"/>
<line x1="160" y1="328" x2="440" y2="328" stroke="#57534e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#s)"/>
<line x1="470" y1="338" x2="470" y2="402" stroke="#57534e" stroke-width="2" marker-end="url(#s)"/>
<line x1="420" y1="412" x2="170" y2="412" stroke="#047857" stroke-width="5" marker-end="url(#g)"/>
<text x="295" y="400" text-anchor="middle" font-weight="bold" fill="#047857">רוח מהיבשה לים</text>
<text x="190" y="377" text-anchor="middle" font-size="26" font-weight="bold" fill="#b91c1c" direction="ltr">L</text>
<text x="408" y="377" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d4ed8" direction="ltr">H</text>
<text x="65" y="374" text-anchor="middle" font-size="13" fill="#57534e">אוויר עולה</text>
</svg>
