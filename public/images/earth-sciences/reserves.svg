<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, Helvetica, sans-serif" font-size="15" direction="rtl">
<defs></defs>
<rect width="600" height="480" fill="#fafaf9"/>
<text x="580" y="40" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2937">עתודה היא רק חלק</text><text x="580" y="62" text-anchor="start" font-size="13" fill="#57534e">מה שידוע, ושאפשר וכדאי להפיק היום</text><rect x="40" y="100" width="520" height="330" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/><text x="540" y="130" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">כל הכמות בכדור הארץ</text><rect x="70" y="160" width="380" height="250" rx="10" fill="#e7dcc6" stroke="#a8a29e" stroke-width="1.5"/><text x="430" y="190" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">ידוע איפה זה נמצא</text><rect x="100" y="220" width="220" height="170" rx="10" fill="#c2410c"/><text x="300" y="252" text-anchor="start" font-size="17" font-weight="bold" fill="#ffffff">עתודה</text><text x="300" y="274" text-anchor="start" font-size="13" fill="#ffedd5">אפשר וכדאי להפיק</text><text x="580" y="462" text-anchor="start" font-size="13" font-weight="bold" fill="#047857">גילויים וטכנולוגיה חדשה מגדילים את העתודה</text>
</svg>
