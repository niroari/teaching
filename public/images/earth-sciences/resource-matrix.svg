<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, Helvetica, sans-serif" font-size="15" direction="rtl">
<defs></defs>
<rect width="600" height="480" fill="#fafaf9"/>
<text x="580" y="40" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2937">שני תבחינים יחד</text><text x="448" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">מתכלה</text><text x="268" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">מתחדש</text><text x="590" y="220" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">קיום</text><text x="590" y="360" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">פיתוח</text><rect x="360" y="150" width="176" height="126" rx="8" fill="#f3e3cc"/><text x="448" y="190" text-anchor="middle" font-size="15" fill="#1f2937">מי תהום מאובנים</text><rect x="180" y="150" width="176" height="126" rx="8" fill="#dcfce7"/><text x="268" y="190" text-anchor="middle" font-size="15" fill="#1f2937">אוויר</text><text x="268" y="216" text-anchor="middle" font-size="15" fill="#1f2937">מי גשם</text><text x="268" y="242" text-anchor="middle" font-size="15" fill="#1f2937">קרקע פורייה</text><rect x="360" y="290" width="176" height="126" rx="8" fill="#fde7d1"/><text x="448" y="330" text-anchor="middle" font-size="15" fill="#1f2937">נפט, פחם, גז</text><text x="448" y="356" text-anchor="middle" font-size="15" fill="#1f2937">מתכות</text><text x="448" y="382" text-anchor="middle" font-size="15" fill="#1f2937">חול לבנייה</text><rect x="180" y="290" width="176" height="126" rx="8" fill="#e0f2fe"/><text x="268" y="330" text-anchor="middle" font-size="15" fill="#1f2937">שמש</text><text x="268" y="356" text-anchor="middle" font-size="15" fill="#1f2937">רוח</text><text x="268" y="382" text-anchor="middle" font-size="15" fill="#1f2937">יערות לעץ</text><text x="20" y="452" text-anchor="end" font-size="13" fill="#57534e">מים, למשל, הם משאב קיום מתחדש</text>
</svg>
